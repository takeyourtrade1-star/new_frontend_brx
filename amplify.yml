version: 1
backend:
  phases:
    build:
      commands:
        - '# No backend build required'
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.18.1
        - nvm use 24.18.1
        - test "$(node --version)" = "v24.18.1"
        - npm ci --ignore-scripts --cache .npm --prefer-offline
        - node scripts/copy-ort-wasm.mjs
        - node scripts/validate-scanner-edge-env.mjs
        - npm audit --audit-level=high
        - npm run lint
        - npm run typecheck
        - npm run i18n:keys
        - npm test -- --run
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
