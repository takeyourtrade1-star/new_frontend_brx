<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icona — 2 frecce in cerchio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: #1d3160;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(29, 49, 96, 0.12);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .icon-btn:hover {
      box-shadow: 0 8px 24px rgba(29, 49, 96, 0.18);
      transform: scale(1.05);
    }

    .icon-btn svg {
      width: 36px;
      height: 36px;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-btn:hover svg {
      transform: rotate(180deg);
    }

    .label {
      position: absolute;
      bottom: 2rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <button class="icon-btn" type="button" aria-label="Aggiorna">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- Freccia superiore (senso orario) -->
      <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
      <path d="M3 3v5h5" />
      <!-- Freccia inferiore (senso antiorario) -->
      <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
      <path d="M21 21v-5h-5" />
    </svg>
  </button>

  <p class="label">Passa il mouse sull'icona per vederla girare</p>
</body>
</html>
